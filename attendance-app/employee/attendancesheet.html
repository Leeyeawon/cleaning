<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월간 출근부</title>

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="stylesheet" href="css/attendancesheet.css" />
</head>
<body data-page="attendancesheet">
  
  <div class="phone">
    <!-- 상단 상태 영역 -->
    <div class="status-area"></div>

    <!-- 페이지 제목 -->
    <header class="page-header">
      <h1>월간 출근부</h1>
    </header>

    <!-- 월 선택 영역 -->
    <section class="month-header">
      <button class="month-btn" id="prevMonthBtn" aria-label="이전 달">
        ‹
      </button>

      <h2 id="currentMonth">2025년 6월</h2>

      <button class="month-btn" id="nextMonthBtn" aria-label="다음 달">
        ›
      </button>
    </section>

    <!-- 달력 영역 -->
    <main class="attendance-main">
      <section class="calendar-card">
        <div class="calendar-placeholder">
          출근부 달력 영역
        </div>
      </section>
    </main>

    <!-- 월간 요약 -->
    <section class="summary-area">
      <div class="summary-wrap">
        <div class="summary-card large">
          <div class="summary-item">
            <strong>20</strong>
            <span>총 근무일</span>
          </div>

          <div class="summary-item border">
            <strong>18</strong>
            <span>정상 출근</span>
          </div>

          <div class="summary-item">
            <strong>2</strong>
            <span>지각</span>
          </div>
        </div>

        <div class="summary-card small">
          <div class="summary-item">
            <strong>0</strong>
            <span>조퇴</span>
          </div>

          <div class="summary-item border">
            <strong>0</strong>
            <span>결근</span>
          </div>

          <div class="summary-item">
            <strong>1</strong>
            <span>확인 필요</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 공통 하단배너 자리 -->
    <div id="bottomNav"></div>
  </div>

  
  <script src="js/common.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/attendancesheet.js"></script>
</body>
</html>
