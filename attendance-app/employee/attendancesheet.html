<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>출근부</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css" />
  <link rel="stylesheet" href="../public/css/attendancesheet.css" />
</head>
<body>
  <div class="phone">
    <header class="sheet-header">
      <div>
        <p class="page-label">ATTENDANCE</p>
        <h1>출근부</h1>
      </div>

      <button id="todayBtn" class="calendar-today-button" type="button">
        오늘
      </button>
    </header>

    <main class="sheet-main">
      <section class="month-card">
        <button id="prevMonthBtn" class="month-button" type="button">‹</button>

        <button id="monthPickerBtn" class="month-picker-button" type="button">
          <span class="month-emoji">📅</span>
          <strong id="currentMonth">2026년 7월</strong>
        </button>

        <input id="monthPicker" class="month-picker-input" type="month" />

        <button id="nextMonthBtn" class="month-button" type="button">›</button>
      </section>

      <section class="attendance-summary">
        <div class="summary-card">
          <p>총 근무</p>
          <strong id="totalWorkDays">0일</strong>
        </div>

        <div class="summary-card success">
          <p>정상</p>
          <strong id="doneCount">0일</strong>
        </div>
      </section>

      <section class="calendar-card">
        <div class="week-row">
          <span>일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <section class="attendance-list">
        <div class="detail-header">
          <h2 id="selectedDateTitle">선택한 날짜</h2>
          <span id="selectedStatusBadge" class="detail-badge">기록 없음</span>
        </div>

        <div class="detail-list">
          <div class="detail-item">
            <span>출근 시간</span>
            <strong id="detailCheckIn">--:--</strong>
          </div>

          <div class="detail-item">
            <span>퇴근 시간</span>
            <strong id="detailCheckOut">--:--</strong>
          </div>

          <div class="detail-item">
            <span>총 근무시간</span>
            <strong id="detailWorkTime">-</strong>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="index.html">
        <span>🏠</span>
        <p>홈</p>
      </a>

      <a href="attendancesheet.html" class="active">
        <span>🧾</span>
        <p>출근부</p>
      </a>

      <a href="request.html">
        <span>📝</span>
        <p>요청</p>
      </a>

      <a href="mypage.html">
        <span>👤</span>
        <p>내 정보</p>
      </a>
    </nav>
    <div id="bottomNav"></div>
  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/mobile.js"></script>
  <script type="module" src="../public/js/attendancesheet.js"></script>
</body>
</html>
