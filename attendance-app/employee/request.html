<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>요청</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css" />
  <link rel="stylesheet" href="../public/css/request.css" />
</head>

<body data-page="request">
  <div class="phone">
    <header class="request-header">
      <div>
        <p>REQUEST</p>
        <h1>요청</h1>
      </div>

      <button id="fontToggleBtn" class="font-size-btn" type="button">
        A+ 글자 크게
      </button>
    </header>

    <main class="request-main">
      <p class="request-guide">
        필요한 업무를 선택해 주세요.
      </p>

      <section class="request-grid">
        <button class="request-menu-card lead-only" data-href="cleaning-checklist.html" type="button">
          <span class="request-menu-icon">✓</span>
          <strong>청소 점검표</strong>
          <p>현장별 점검 항목을 확인하고 완료 항목을 제출합니다.</p>
          <small>팀장 전용</small>
        </button>

        <button class="request-menu-card lead-only" data-href="request-supply.html" type="button">
          <span class="request-menu-icon">▣</span>
          <strong>비품 요청</strong>
          <p>현장에 필요한 비품과 수량을 관리자에게 요청합니다.</p>
          <small>팀장 전용</small>
        </button>

        <button class="request-menu-card" data-href="request-general.html" type="button">
          <span class="request-menu-icon">✎</span>
          <strong>요청 사항</strong>
          <p>관리자에게 일반 요청이나 건의사항을 전달합니다.</p>
        </button>

        <button class="request-menu-card" data-href="request-leave.html" type="button">
          <span class="request-menu-icon">○</span>
          <strong>연차 신청</strong>
          <p>연차 사용 날짜와 신청 사유를 작성합니다.</p>
        </button>
      </section>
    </main>

    <div id="bottomNav"></div>
  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/mobile.js"></script>
  <script type="module" src="../public/js/request.js"></script>
</body>
</html>
