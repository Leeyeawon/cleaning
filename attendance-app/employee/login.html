<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>직원 로그인</title>

  <meta name="theme-color" content="#171717" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css" />
  <link rel="stylesheet" href="../public/css/login.css" />
</head>

<body data-page="login">
  <div class="phone">
    <main class="login-main">
      <section class="login-card">
        <div class="login-logo">
          📍
        </div>

        <h1>
          직원 출퇴근 체크
        </h1>

        <p>
          이름과 전화번호로 로그인한 후<br />
          관리자의 승인을 받아야 앱을 사용할 수 있습니다.
        </p>

        <form id="phoneLoginForm" class="phone-form" >
          <label>
            이름

            <input
              id="userNameInput"
              type="text"
              placeholder="직원 이름"
              autocomplete="name"
              required
            />
          </label>

          <label>
            전화번호

            <input
              id="phoneInput"
              type="tel"
              inputmode="numeric"
              placeholder="01012345678"
              autocomplete="tel"
              required
            />
          </label>

          <button id="loginSubmitBtn" class="login-button" type="submit">
            로그인
          </button>
        </form>

        <p class="login-guide">
          관리자가 웹에서 미리 등록한 이름과 전화번호가 일치해야 합니다.
        </p>
      </section>
    </main>
  </div>

  <script type="module" src="../public/js/login.js"
  ></script>
</body>
</html>
