<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정보</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css" />
  <link rel="stylesheet" href="../public/css/mypage.css" />
</head>
<body>
  <div class="phone">
    <header class="mypage-header">
      <div>
        <p class="page-label">MY PAGE</p>
        <h1>내 정보</h1>
      </div>

      <span class="employee-status">활성</span>
    </header>

    <main class="mypage-main">
      <section class="profile-card">
        <div class="profile-top">
          <div class="profile-avatar">김</div>

          <div class="profile-info">
            <h2 id="employeeName">김민준</h2>
            <p id="employeeTeam">현장팀</p>
          </div>
        </div>

        <div class="profile-list">
          <div class="profile-item">
            <span>아이디</span>
            <strong id="employeeLoginId">minjun</strong>
          </div>

          <div class="profile-item">
            <span>연락처</span>
            <strong id="employeePhone">010-0000-0000</strong>
          </div>

          <div class="profile-item">
            <span>입사일</span>
            <strong id="employeeJoinDate">2026.07.01</strong>
          </div>
        </div>
      </section>

      <section class="mypage-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">WORK AREA</p>
            <h2>배정 근무지역</h2>
          </div>
        </div>

        <div class="region-list" id="regionList">
          <span class="region-chip">서면 B구역</span>
          <span class="region-chip">해운대 A구역</span>
        </div>

        <p class="card-guide">
          배정된 근무지역 안에서만 출퇴근 체크가 가능합니다.
        </p>
      </section>

      <section class="mypage-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">ACCOUNT</p>
            <h2>계정 관리</h2>
          </div>
        </div>

        <div class="menu-list">
          <button class="menu-item" type="button">
            <div>
              <strong>연락처 수정</strong>
              <p>현재 등록된 전화번호를 변경합니다.</p>
            </div>
            <span>›</span>
          </button>

          <button class="menu-item" type="button">
            <div>
              <strong>비밀번호 변경</strong>
              <p>로그인 비밀번호를 변경합니다.</p>
            </div>
            <span>›</span>
          </button>

          <button class="menu-item" type="button">
            <div>
              <strong>내 정보 변경 요청</strong>
              <p>이름, 부서, 근무지역 변경은 관리자에게 요청합니다.</p>
            </div>
            <span>›</span>
          </button>
        </div>
      </section>

      <section class="mypage-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">APP SETTING</p>
            <h2>앱 설정</h2>
          </div>
        </div>

        <div class="setting-list">
          <div class="setting-item">
            <div>
              <strong>위치 권한</strong>
              <p>출퇴근 체크를 위해 필요합니다.</p>
            </div>

            <span id="locationPermission" class="permission-badge allowed">
              허용됨
            </span>
          </div>

          <div class="setting-item">
            <div>
              <strong>알림 설정</strong>
              <p>공지사항과 근무 알림을 받습니다.</p>
            </div>

            <label class="switch">
              <input type="checkbox" checked />
              <span></span>
            </label>
          </div>
        </div>
      </section>

      <button class="logout-button" type="button">
        로그아웃
      </button>
    </main>

    <div id="bottomNav"></div>
  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/mobile.js"></script>
  <script src="../public/js/mypage.js"></script>
</body>
</html>
