<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta 
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  
  <title>
    지역 관리 | 근태관리 Admin
  </title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/pc.css" />
  <link rel="stylesheet" href="../public/css/admin.css" />
  <link
    rel="stylesheet"
    href="../public/css/admin-departments.css?v=39"
  />

</head>

<body data-admin-page="departments">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>지역 관리</h2>

          <p>
            출근 가능 지역과 허용 반경을
            관리합니다.
          </p>
        </div>

        <div class="header-actions">
          <button
            class="download-button"
            type="button"
            id="addZoneBtn"
          >
            + 근무지역 등록
          </button>
        </div>
      </header>

      <section class="content">
        <section
          class="stats-grid zone-summary-grid"
        >
          <article class="stat-card">
            <p>전체 지역</p>

            <strong id="totalWorkplaceCount">
              0
            </strong>

            <span>개</span>
          </article>

          <article class="stat-card">
            <p>활성 직원</p>

            <strong id="activeEmployeeCount">
              0
            </strong>

            <span>명</span>
          </article>

          <article class="stat-card dark">
            <p>배정 직원</p>

            <strong id="assignedEmployeeCount">
              0
            </strong>

            <span>명</span>
          </article>

          <article class="stat-card warning">
            <p>미배정 직원</p>

            <strong id="unassignedEmployeeCount">
              0
            </strong>

            <span>명</span>
          </article>

          <article class="stat-card">
            <p>전체 배정</p>

            <strong id="totalAssignmentCount">
              0
            </strong>

            <span>건</span>
          </article>
        </section>

        <section class="zone-filter-panel">
          <div class="zone-filter-group">
            <input
              type="search"
              id="zoneSearchInput"
              placeholder="지역명 검색"
            />

            <select id="zoneRadiusFilter">
              <option value="all">
                전체 반경
              </option>

              <option value="100">
                100m 이하
              </option>

              <option value="150">
                150m 이하
              </option>

              <option value="200">
                200m 이하
              </option>

              <option value="300">
                300m 이하
              </option>
            </select>

            <input
              type="search"
              id="zoneAddressInput"
              placeholder="주소 검색"
            />
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>근무지역 목록</h3>

            <span id="filteredWorkplaceCount">
              0개 지역
            </span>
          </div>

          <div class="attendance-table-wrap">
            <table class="attendance-table">
              <thead>
                <tr>
                  <th>근무지명</th>
                  <th>주소</th>
                  <th>허용 반경</th>
                  <th>배정 직원</th>
                  <th>관리</th>
                </tr>
              </thead>

              <tbody id="workplaceTableBody">
                <tr>
                  <td colspan="5">
                    근무지역 정보를 불러오는
                    중입니다.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </div>

  <!-- 근무지역 등록·수정 -->
  <div
    class="zone-modal"
    id="zoneModal"
  >
    <div class="zone-modal-content zone-map-modal">
      <div class="zone-modal-header">
        <h3 id="zoneModalTitle">
          근무지역 등록
        </h3>

        <button type="button" id="zoneModalCloseBtn" aria-label="닫기" >
          ×
        </button>
      </div>

      <div class="zone-modal-body">
        <div class="zone-editor-layout">
          <div class="zone-form-grid">
            <label class="full">
              근무지명

              <input
                type="text"
                id="zoneNameInput"
                placeholder="예: 서면지점"
              />
            </label>

            <label class="full">
              주소

              <div class="zone-address-row">
                <input
                  type="text"
                  id="zoneAddressFormInput"
                  placeholder="주소 검색 버튼을 눌러주세요."
                  readonly
                />

                <button
                  id="zoneAddressSearchBtn"
                  class="zone-address-search-btn"
                  type="button"
                >
                  주소 검색
                </button>
              </div>

              <small id="zoneAddressGuide">
                검색한 주소에 맞춰 위치가 자동으로 설정됩니다.
              </small>
            </label>

            <label>
              위도

              <input
                type="number"
                id="zoneLatInput"
                step="any"
                readonly
                placeholder="주소 검색 후 자동 입력"
              />
            </label>

            <label>
              경도

              <input
                type="number"
                id="zoneLngInput"
                step="any"
                readonly
                placeholder="주소 검색 후 자동 입력"
              />
            </label>

            <label>
              출근 허용 반경

              <input
                type="number"
                id="zoneRadiusInput"
                min="1"
                max="5000"
                value="100"
                placeholder="100"
              />
            </label>

            <label>
              단위

              <input
                type="text"
                value="m"
                disabled
              />
            </label>
          </div>

          <section class="zone-map-section">
            <div class="zone-map-heading">
              <strong>출근 허용 위치</strong>

              <small>
                원 안에서만 출퇴근할 수 있습니다.
              </small>
            </div>

            <div
              id="zoneMap"
              class="zone-map"
            ></div>

            <p id="zoneMapStatus">
              주소를 검색하면 지도에 위치가 표시됩니다.
            </p>
          </section>
        </div>
      </div>

      <div class="zone-modal-footer">
        <button type="button" class="cancel-btn" id="zoneModalCancelBtn" >
          취소
        </button>

        <button type="button" class="save-btn" id="zoneSaveBtn" >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 직원 배정 -->
  <div class="zone-modal" id="assignModal" >
    <div class="zone-modal-content small">
      <div class="zone-modal-header">
        <h3 id="assignModalTitle">
          직원 배정
        </h3>

        <button type="button" id="assignModalCloseBtn" aria-label="닫기" >
          ×
        </button>
      </div>

      <div class="zone-modal-body">
        <p
          id="assignmentCountText"
          style="
            margin-bottom:12px;
            color:#737373;
            font-size:13px;
          "
        >
          배정된 직원을 선택합니다.
        </p>

        <div style=" display:flex; gap:8px; margin-bottom:12px; " >
          <button type="button" class="table-action-btn" id="selectAllEmployeesBtn" >
            전체 선택
          </button>

          <button type="button" class="table-action-btn" id="clearAllEmployeesBtn" >
            전체 해제
          </button>
        </div>

        <div class="assigned-employee-box">
          <h4>직원 목록</h4>
          <div id="assignEmployeeList" class="zone-employee-list" ></div>
        </div>
      </div>

      <div class="zone-modal-footer">
        <button type="button" class="cancel-btn" id="assignModalCancelBtn" >
          취소
        </button>

        <button type="button" class="save-btn" id="assignSaveBtn" >
          배정 저장
        </button>
      </div>
    </div>
  </div>

  <script
    src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"
  ></script>
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=173e77598d2030bf540832f84c688bd3&libraries=services"
  ></script>


  <script src="../public/js/common.js"></script>
  <script type="module" src="../public/js/pc.js?v=44" ></script>
  <script type="module" src="../public/js/admin-departments.js?v=39" ></script>

</body>
</html>
