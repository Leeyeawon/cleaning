<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직원 관리 | 관리자</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/pc.css" />
  <link rel="stylesheet" href="../public/css/admin.css" />
  <link rel="stylesheet" href="../public/css/admin-employees.css" />
</head>

<body data-admin-page="employees">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>직원 관리</h2>
          <p>직원 정보, 소속, 근무지역 배정과 계정 상태를 관리합니다.</p>
        </div>

        <div class="header-actions">
          <button class="download-button" type="button">
            <span>미배정 직원</span>
            <strong id="headerUnassignedCount">0명</strong>
          </button>
          <button id="employeeAddBtn" class="header-employee-button" type="button">
          + 직원 등록
          </button>
        </div>
      </header>

      <div class="employee-page-inner">
        <section class="employee-summary-grid">
          <article class="employee-summary-card">
            <span>전체 직원</span>
            <strong id="totalEmployeeCount">0</strong>
            <small>명</small>
          </article>

          <article class="employee-summary-card">
            <span>활성 직원</span>
            <strong id="activeEmployeeCount">0</strong>
            <small>명</small>
          </article>

          <article class="employee-summary-card">
            <span>미배정 직원</span>
            <strong id="unassignedEmployeeCount">0</strong>
            <small>명</small>
          </article>

          <article class="employee-summary-card">
            <span>비활성 직원</span>
            <strong id="inactiveEmployeeCount">0</strong>
            <small>명</small>
          </article>
        </section>

        <section class="employee-app-approval-card">
          <div class="section-title-row">
            <div>
              <h2>앱 승인 대기</h2>

              <p>
                직원이 앱에서 처음 로그인하면 이곳에 표시됩니다.
              </p>
            </div>

            <span id="appApprovalPendingCount">
              0명
            </span>
          </div>

          <div
            id="appApprovalPendingList"
            class="app-approval-pending-list"
          >
            <p class="app-approval-empty">
              승인 대기 직원을 불러오는 중입니다.
            </p>
          </div>
        </section>

        <section class="employee-filter-card">
          <input
            id="employeeSearchInput"
            type="search"
            placeholder="직원명, 연락처, 검색"
          />

          <select id="employeeStatusFilter">
            <option value="all">전체 상태</option>
            <option value="active">활성</option>
            <option value="pending">대기</option>
            <option value="inactive">비활성</option>
            <option value="resigned">퇴사</option>
          </select>

          <select id="employeeRegionFilter">
            <option value="all">전체 지역</option>
          </select>

          <select id="employeeTeamFilter">
            <option value="all">전체 소속</option>
            <option value="현장팀">현장팀</option>
            <option value="운영팀">운영팀</option>
            <option value="디자인팀">디자인팀</option>
          </select>

          <label class="check-filter">
            <input id="unassignedOnlyCheck" type="checkbox" />
            미배정만 보기
          </label>
        </section>

        <section class="employee-list-card">
          <div class="section-title-row">
            <h2>직원 목록</h2>
            <span id="employeeListCount">0명</span>
          </div>

          <div class="table-scroll">
            <table class="employee-table">
              <thead>
                <tr>
                  <th>직원명</th>
                  <th>연락처</th>
                  <th>직급</th>
                  <th>소속</th>
                  <th>배정 지역</th>
                  <th>상태</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="employeeTableBody">
                <tr>
                  <td colspan="7" class="empty-table">직원 정보를 불러오는 중입니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="employeeModal" class="employee-modal">
    <div class="employee-modal-panel">
      <div class="employee-modal-header">
        <h2>직원 등록</h2>
        <button id="employeeModalCloseBtn" type="button">×</button>
      </div>

      <form id="employeeForm" class="employee-form">
        <label>
          직원명
          <input id="employeeNameInput" type="text" required />
        </label>

        <label>
          연락처
          <input id="employeePhoneInput" type="tel" placeholder="01012345678" required />
        </label>

        <label>
          직급
          <select id="employeeRoleInput">
            <option value="employee">일반 직원</option>
            <option value="team_lead">팀장</option>
          </select>
        </label>

        <label>
          소속
          <select id="employeeDepartmentInput">
            <option value="현장팀">현장팀</option>
            <option value="운영팀">운영팀</option>
            <option value="디자인팀">디자인팀</option>
          </select>
        </label>

        <label>
          상태
          <select id="employeeStatusInput">
            <option value="active">활성</option>
            <option value="pending">대기</option>
            <option value="inactive">비활성</option>
            <option value="resigned">퇴사</option>
          </select>
        </label>

        <label>
          배정 지역
          <select id="employeeWorkplaceInput">
            <option value="">미배정</option>
          </select>
        </label>

        <label class="full">
          관리자 메모
          <textarea id="employeeMemoInput" rows="4"></textarea>
        </label>

        <div class="employee-form-actions">
          <button id="employeeCancelBtn" type="button" class="ghost-btn">취소</button>
          <button type="submit" class="common-header-primary-button">저장</button>
        </div>
      </form>
    </div>
  </div>

    <!-- 소속 / 근무지 빠른 배정 팝업 -->
  <div id="quickAssignModal" class="quick-assign-modal"aria-hidden="true" >
    <div class="quick-assign-panel">
      <header class="quick-assign-header">
        <div>
          <p>QUICK ASSIGN</p>
          <h2 id="quickAssignTitle">
            소속 배정
          </h2>

          <span id="quickAssignEmployeeName">
            직원명
          </span>
        </div>

        <button
          id="quickAssignCloseBtn"
          type="button"
        >
          ×
        </button>
      </header>

      <div
        id="quickAssignOptionList"
        class="quick-assign-option-list"
      ></div>

      <footer class="quick-assign-actions">
        <button
          id="quickAssignCancelBtn"
          type="button"
        >
          취소
        </button>

        <button
          id="quickAssignSaveBtn"
          type="button"
        >
          배정 저장
        </button>
      </footer>
    </div>
  </div>

  <script src="../public/js/common.js"></script>
  <script type="module" src="../public/js/pc.js"></script>
  <script type="module" src="../public/js/admin-employees.js"></script>
  <script type="module" src="../public/js/admin-app-approval.js" ></script> </body>
</html>
