<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>직원 관리 | 근태관리 Admin</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/pc.css" />
  <link rel="stylesheet" href="../public/css/admin.css" />
</head>

<body data-admin-page="employees">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>직원 관리</h2>
          <p>직원 정보, 근무지역 배정, 계정 상태를 관리합니다.</p>
        </div>

        <div class="header-actions">
          <button class="download-button" type="button" id="addEmployeeBtn">
            + 직원 등록
          </button>
        </div>
      </header>

      <section class="content">
        <section class="stats-grid employee-summary-grid">
          <article class="stat-card">
            <p>전체 직원</p>
            <strong>48</strong>
            <span>명</span>
          </article>

          <article class="stat-card">
            <p>활성 직원</p>
            <strong>42</strong>
            <span>명</span>
          </article>

          <article class="stat-card warning">
            <p>미배정 직원</p>
            <strong>5</strong>
            <span>명</span>
          </article>

          <article class="stat-card dark">
            <p>비활성 직원</p>
            <strong>3</strong>
            <span>명</span>
          </article>

          <article class="stat-card">
            <p>신규 등록</p>
            <strong>2</strong>
            <span>명</span>
          </article>
        </section>

        <section class="employee-filter-panel">
          <div class="employee-filter-group">
            <input type="text" id="employeeSearchInput" placeholder="직원명 검색" />

            <select id="employeeStatusFilter">
              <option value="all">전체 상태</option>
              <option value="활성">활성</option>
              <option value="대기">대기</option>
              <option value="비활성">비활성</option>
              <option value="퇴사">퇴사</option>
            </select>

            <select id="employeeRegionFilter">
              <option value="all">전체 지역</option>
              <option value="서면 B구역">서면 B구역</option>
              <option value="해운대 A구역">해운대 A구역</option>
              <option value="남포동 C구역">남포동 C구역</option>
              <option value="미배정">미배정</option>
            </select>

            <select id="employeeTeamFilter">
              <option value="all">전체 소속</option>
              <option value="현장팀">현장팀</option>
              <option value="운영팀">운영팀</option>
              <option value="디자인팀">디자인팀</option>
            </select>

            <label class="unassigned-check">
              <input type="checkbox" id="unassignedOnlyCheck" />
              미배정만 보기
            </label>
          </div>
        </section>

        <section class="employee-layout employee-list-only">
          <article class="panel employee-table-panel">
            <div class="panel-header">
              <h3>직원 목록</h3>
              <button type="button">전체 보기 ›</button>
            </div>

            <div class="attendance-table-wrap">
              <table class="attendance-table employee-table">
                <thead>
                  <tr>
                    <th>직원명</th>
                    <th>연락처</th>
                    <th>소속</th>
                    <th>배정 지역</th>
                    <th>상태</th>
                    <th>이번 달 근태</th>
                    <th>관리</th>
                  </tr>
                </thead>

                <tbody id="employeeTableBody"></tbody>
              </table>
            </div>
          </article>
        </section>      </section>
    </main>
  </div>

  <div class="employee-modal" id="employeeModal">
    <div class="employee-modal-content">
      <div class="employee-modal-header">
        <h3 id="employeeModalTitle">직원 등록</h3>
        <button type="button" id="employeeModalCloseBtn">×</button>
      </div>

      <div class="employee-modal-body">
        <div class="employee-form-grid">
          <label>
            직원명
            <input type="text" id="employeeNameInput" placeholder="직원명 입력" />
          </label>

          <label>
            연락처
            <input type="text" id="employeePhoneInput" placeholder="010-0000-0000" />
          </label>

          <label>
            로그인 ID
            <input type="text" id="employeeLoginInput" placeholder="로그인 ID" />
          </label>

          <label>
            소속
            <select id="employeeTeamInput">
              <option value="현장팀">현장팀</option>
              <option value="운영팀">운영팀</option>
              <option value="디자인팀">디자인팀</option>
            </select>
          </label>

          <label>
            상태
            <select id="employeeStatusInput">
              <option value="활성">활성</option>
              <option value="대기">대기</option>
              <option value="비활성">비활성</option>
              <option value="퇴사">퇴사</option>
            </select>
          </label>

          <label>
            배정 지역
            <select id="employeeRegionInput">
              <option value="서면 B구역">서면 B구역</option>
              <option value="해운대 A구역">해운대 A구역</option>
              <option value="남포동 C구역">남포동 C구역</option>
              <option value="미배정">미배정</option>
            </select>
          </label>
        </div>

        <label class="employee-memo-label">
          관리자 메모
          <textarea id="employeeMemoInput" placeholder="예: 서면 B구역 선호, 주말 근무 가능"></textarea>
        </label>
      </div>

      <div class="employee-modal-footer">
        <button type="button" class="cancel-btn" id="employeeModalCancelBtn">취소</button>
        <button type="button" class="save-btn" id="employeeSaveBtn">저장</button>
      </div>
    </div>
  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/pc.js"></script>
  <script src="../public/js/admin-employees-data.js"></script>
  <script src="../public/js/admin-employees.js"></script>
  
</body>
</html>
