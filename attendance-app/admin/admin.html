<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>대시보드 | 근태관리 Admin</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/pc.css" />
  <link rel="stylesheet" href="../public/css/admin.css" />
</head>

<body data-admin-page="admin">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>대시보드</h2>
          <p id="dashboardDate">관리자 운영 현황을 확인합니다.</p>
        </div>

        <div class="header-actions">
          <button class="icon-button" type="button">
            <span class="notice-dot"></span>
          </button>

          <button class="download-button" type="button" id="dashboardRefreshBtn">
            새로고침
          </button>
        </div>
      </header>

      <section class="content">
        <section class="dashboard-hero">
          <div>
            <span>오늘의 관리자 체크</span>
            <h3>처리해야 할 업무가 9건 있습니다.</h3>
            <p>미확인 지각 사유, 미출근 연락, 출퇴근 수정 요청을 확인해 주세요.</p>
          </div>

          <a href="admin-attendance-issue.html">문제 현황 확인</a>
        </section>

        <section class="stats-grid dashboard-summary-grid">
          <article class="stat-card">
            <p>전체 직원</p>
            <strong>48</strong>
            <span>명</span>
          </article>

          <article class="stat-card">
            <p>활성 근무 지역</p>
            <strong>12</strong>
            <span>개</span>
          </article>

          <article class="stat-card warning">
            <p>오늘 처리 필요</p>
            <strong>9</strong>
            <span>건</span>
          </article>

          <article class="stat-card warning">
            <p>미확인 요청</p>
            <strong>5</strong>
            <span>건</span>
          </article>

          <article class="stat-card dark">
            <p>반복 지각 직원</p>
            <strong>3</strong>
            <span>명</span>
          </article>
        </section>

        <section class="dashboard-grid">
          <article class="panel dashboard-task-panel">
            <div class="panel-header">
              <h3>오늘 관리자 체크리스트</h3>
              <button type="button">전체 보기 ›</button>
            </div>

            <div class="dashboard-task-list" id="dashboardTaskList"></div>
          </article>

          <article class="panel dashboard-quick-panel">
            <div class="panel-header">
              <h3>빠른 작업</h3>
            </div>

            <div class="quick-action-grid">
              <a href="admin-employees.html">직원 등록</a>
              <a href="admin-departments.html">근무 지역 추가</a>
              <a href="admin-notices.html">공지 작성</a>
              <a href="admin-attendance-edit.html">기록 수정</a>
            </div>
          </article>
        </section>

        <section class="dashboard-grid">
          <article class="panel dashboard-region-panel">
            <div class="panel-header">
              <h3>지역별 운영 현황</h3>
              <button type="button">지역 관리 ›</button>
            </div>

            <div class="dashboard-region-list" id="dashboardRegionList"></div>
          </article>

          <article class="panel dashboard-request-panel">
            <div class="panel-header">
              <h3>최근 요청사항</h3>
              <button type="button">요청 관리 ›</button>
            </div>

            <div class="dashboard-request-list" id="dashboardRequestList"></div>
          </article>
        </section>

        <section class="panel dashboard-activity-panel">
          <div class="panel-header">
            <h3>최근 관리자 활동</h3>
            <button type="button">이력 보기 ›</button>
          </div>

          <div class="dashboard-activity-list" id="dashboardActivityList"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/pc.js"></script>
  <script src="../public/js/admin.js"></script>
</body>
</html>
