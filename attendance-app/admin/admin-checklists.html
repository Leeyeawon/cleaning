<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>청소 점검표 | 관리자</title>

  <link
    rel="stylesheet"
    href="../public/css/common.css"
  />
  <link
    rel="stylesheet"
    href="../public/css/pc.css"
  />
  <link
    rel="stylesheet"
    href="../public/css/admin.css"
  />
  <link
    rel="stylesheet"
    href="../public/css/admin-workflow.css"
  />
</head>

<body data-admin-page="checklists">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>청소 점검표</h2>

          <p>
            점검 항목을 만들고 현장별 점검표에
            필요한 항목을 배정합니다.
          </p>
        </div>
      </header>

      <section class="content">
        <section class="workflow-two-column">
          <article class="panel workflow-panel">
            <div class="panel-header">
              <div>
                <h3>점검 항목 보관함</h3>
                <p>모든 현장에서 사용할 항목을 관리합니다.</p>
              </div>

              <span id="checklistItemCount">0개</span>
            </div>

            <div class="workflow-panel-body">
              <form
                id="checklistItemForm"
                class="workflow-inline-form"
              >
                <input
                  id="checklistItemInput"
                  type="text"
                  maxlength="100"
                  placeholder="예: 바닥 청소 상태 확인"
                  required
                />

                <button type="submit">
                  항목 추가
                </button>
              </form>

              <div
                id="checklistCatalog"
                class="workflow-item-list"
              >
                <p class="workflow-list-empty">
                  점검 항목을 불러오는 중입니다.
                </p>
              </div>
            </div>
          </article>

          <article class="panel workflow-panel">
            <div class="panel-header">
              <div>
                <h3>현장별 항목 배정</h3>
                <p>앱에 표시할 항목을 선택합니다.</p>
              </div>

              <span id="assignedItemCount">0개 선택</span>
            </div>

            <div class="workflow-panel-body">
              <label class="workflow-field">
                현장 선택

                <select id="checklistWorkplaceSelect">
                  <option value="">
                    현장을 불러오는 중입니다.
                  </option>
                </select>
              </label>

              <p class="workflow-help">
                체크한 항목만 해당 현장의 청소 점검표에
                표시됩니다.
              </p>

              <div
                id="workplaceChecklistItems"
                class="workflow-item-list"
              >
                <p class="workflow-list-empty">
                  현장을 선택해 주세요.
                </p>
              </div>

              <button
                id="saveWorkplaceChecklistBtn"
                class="workflow-primary"
                type="button"
              >
                현장 점검표 저장
              </button>

              <p
                id="checklistSaveMessage"
                class="workflow-save-message"
              ></p>
            </div>
          </article>
        </section>

        <section class="panel workflow-submission-panel">
					<div class="panel-header">
						<div>
							<h3>청소 점검표 제출 내역</h3>
							<p> 팀장이 앱에서 제출한 현장별 점검 결과입니다. </p> 
						</div>

						<span id="submissionCount">0건</span>
					</div>

					<div class="workflow-panel-body">
						<div class="workflow-submission-filter">
							<input id="submissionDateFilter" type="date" aria-label="제출 날짜" />
							<select id="submissionWorkplaceFilter">
								<option value="all">전체 현장</option>
							</select>

							<input
									id="submissionSearchInput"
									type="search"
									placeholder="직원명 검색"
							/>

							<button id="submissionFilterResetBtn" type="button" >
									필터 초기화
							</button>
						</div>

						<div class="attendance-table-wrap">
							<table class="attendance-table workflow-submission-table">
								<thead>
								<tr>
										<th>제출일시</th>
										<th>현장</th>
										<th>직원</th>
										<th>완료 수</th>
										<th>완료한 항목</th>
										<th>점검 메모</th>
								</tr>
								</thead>

								<tbody id="submissionTableBody">
									<tr>
											<td colspan="6" class="workflow-empty" >
											제출 내역을 불러오는 중입니다.
											</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</section>
      </section>
    </main>
  </div>

  <script src="../public/js/common.js"></script>
  <script type="module" src="../public/js/pc.js" ></script>
	<script type="module" src="../public/js/admin-checklists.js" ></script>
</body>
</html>
