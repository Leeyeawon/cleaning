<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>출퇴근 기록 수정 | 근태관리 Admin</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/pc.css" />
  <link rel="stylesheet" href="../public/css/admin.css" />
  <link rel="stylesheet" href="../public/css/admin-attendance.css" />
</head>

<body data-admin-page="attendance-edit">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>출퇴근 기록 수정</h2>
          <p>누락, 오류, 관리자 확인이 필요한 출퇴근 기록을 수정합니다.</p>
        </div>

        <div class="header-actions">
          <button
            class="download-button"
            id="editHistoryDownloadBtn"
            type="button"
          >
            수정 이력 다운로드
          </button>
        </div>
      </header>

      <section class="content">
        <section class="attendance-sub-tabs">
          <a href="admin-attendance.html" class="attendance-sub-tab">오늘 출퇴근 현황</a>
          <a href="admin-attendance-issue.html" class="attendance-sub-tab">지각·미출근 관리</a>
          <a href="admin-attendance-monthly.html" class="attendance-sub-tab">월간 출근부</a>
          <a href="admin-attendance-edit.html" class="attendance-sub-tab active">출퇴근 기록 수정</a>
        </section>

        <section class="stats-grid">
          <article class="stat-card warning">
            <p>수정 필요</p>
            <strong id="editRequiredCount">0</strong>
            <span>건</span>
          </article>

          <article class="stat-card">
            <p>퇴근 누락</p>
            <strong id="missingCheckOutCount">0</strong>
            <span>건</span>
          </article>

          <article class="stat-card dark">
            <p>위치 오류</p>
            <strong id="locationErrorCount">0</strong>
            <span>건</span>
          </article>

          <article class="stat-card">
            <p>오늘 수정 완료</p>
            <strong id="todayEditedCount">0</strong>
            <span>건</span>
          </article>
        </section>

        <section class="edit-filter-panel">
          <div class="edit-filter-group">
            <label>
              날짜 선택
              <input type="date" id="editDateFilter" />
            </label>

            <label>
              수정 유형
              <select id="editTypeFilter">
                <option value="all">전체 유형</option>
                <option value="퇴근 누락">퇴근 누락</option>
                <option value="출근 누락">출근 누락</option>
                <option value="위치 오류">위치 오류</option>
                <option value="시간 조정">시간 조정</option>
              </select>
            </label>

            <label>
              처리 상태
              <select id="editStatusFilter">
                <option value="all">전체 상태</option>
                <option value="수정 필요">수정 필요</option>
                <option value="수정 완료">수정 완료</option>
              </select>
            </label>

            <label>
              직원 검색
              <input type="text" id="editSearchInput" placeholder="직원명 검색" />
            </label>
          </div>
        </section>

        <section class="edit-layout">
          <article class="panel edit-main-panel">
            <div class="panel-header">
              <h3>수정 대상 출퇴근 기록</h3>
                <button type="button" id="editResetFilterBtn">
                  전체 보기 ›
                </button>
            </div>

            <div class="edit-notice">
              출퇴근 기록 수정 시 <strong>수정 사유</strong>는 필수로 남기는 것을 추천합니다.
            </div>

            <div class="attendance-table-wrap">
              <table class="attendance-table edit-table">
                <thead>
                  <tr>
                    <th>직원명</th>
                    <th>날짜</th>
                    <th>유형</th>
                    <th>출근</th>
                    <th>퇴근</th>
                    <th>상태</th>
                    <th>관리</th>
                  </tr>
                </thead>

                <tbody id="editTableBody"></tbody>
              </table>
            </div>
          </article>

          <aside class="panel edit-history-panel">
            <div class="panel-header">
              <h3>최근 수정 이력</h3>
            </div>

            <div class="edit-history-list" id="editHistoryList"></div>
          </aside>
        </section>
      </section>
    </main>
  </div>

  <div class="edit-modal" id="editModal">
    <div class="edit-modal-content">
      <div class="edit-modal-header">
        <h3>출퇴근 기록 수정</h3>
        <button type="button" id="editModalCloseBtn">×</button>
      </div>

      <div class="edit-modal-body">
        <div class="modal-employee-box">
          <strong id="editModalEmployeeName">직원명</strong>
          <p id="editModalEmployeeInfo">날짜 · 수정 유형</p>
        </div>

        <div class="edit-time-grid">
          <label>
            출근 시간
            <input type="time" id="editCheckInInput" />
          </label>

          <label>
            퇴근 시간
            <input type="time" id="editCheckOutInput" />
          </label>
        </div>

        <label>
          처리 상태
          <select id="editRecordStatusSelect">
            <option value="수정 필요">수정 필요</option>
            <option value="수정 완료">수정 완료</option>
          </select>
        </label>

        <label>
          수정 사유
          <select id="editReasonSelect">
            <option value="직원 퇴근 누락">직원 퇴근 누락</option>
            <option value="직원 출근 누락">직원 출근 누락</option>
            <option value="GPS 오류">GPS 오류</option>
            <option value="관리자 확인 완료">관리자 확인 완료</option>
            <option value="근무시간 조정">근무시간 조정</option>
            <option value="기타">기타</option>
          </select>
        </label>

        <label>
          상세 메모
          <textarea id="editMemoInput" placeholder="예: 현장 담당자 확인 후 퇴근 시간을 18:03으로 수정"></textarea>
        </label>
      </div>

      <div class="edit-modal-footer">
        <button type="button" class="cancel-btn" id="editModalCancelBtn">취소</button>
        <button type="button" class="save-btn" id="editSaveBtn">저장</button>
      </div>
    </div>
  </div>

  
  <script src="../public/js/common.js"></script>
  <script src="../public/js/pc.js"></script>
  <script type="module" src="../public/js/admin-attendance-edit.js"></script>
</body>
</html>
